# The licences the Rust dependencies may carry, which `cargo deny check licenses` checks
# in scripts/check: permissive ones, which jolty's Apache-2.0 can carry. A dependency
# offering a choice passes when it offers one of them.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
]
