[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "jolty"
version = "0.1.0"
description = "A compiler and simulator for electronic circuits, built for AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Maxence Faldor", email = "maxencefaldor@gmail.com" }]
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.optional-dependencies]
mcp = ["mcp>=2.1"]

[project.scripts]
jolty = "jolty.cli:main"
jolty-mcp = "jolty.mcp:main"

[project.urls]
Source = "https://github.com/maxencefaldor/jolty"
Issues = "https://github.com/maxencefaldor/jolty/issues"

[dependency-groups]
dev = [
    "hypothesis",
    "maturin",
    "mcp>=2.1",
    "pytest",
    "ruff",
    "rumdl",
    "ty",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.1.1",
]

[tool.uv]
# uv rebuilds the extension when one of these changes, its Rust sources included.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.maturin]
manifest-path = "crates/jolty-python/Cargo.toml"
module-name = "jolty._core"
python-source = "src"
features = ["pyo3/extension-module"]

# ruff: the formatter at its defaults (4 spaces, 88 columns), so no width and
# no indent appear here. The lint is strict: every stable rule is on.
[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# The one rule the formatter contradicts: it places trailing commas itself.
# TC: pydantic reads annotations at runtime, so an import used only in an
# annotation is still a runtime import.
ignore = ["COM812", "TC"]

[tool.ruff.lint.flake8-builtins]
# "id" names an instance in the circuit format, the engine and the builder alike.
builtins-ignorelist = ["id"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest checks with assert and imports tests by path; a test's name says what it
# checks, and the values it expects are its content.
"tests/**" = ["D100", "D103", "INP001", "PLR2004", "S101"]
"tests/test_ngspice.py" = ["S603"]  # runs ngspice on the decks the tests write
# Examples are circuits written as scripts: their numbers are the circuit, and
# they run as scripts, outside any package.
"examples/**" = ["INP001", "PLR2004"]
# Scripts that write the docs' pages run outside any package, and say what they wrote.
"docs/*.py" = ["INP001", "T201"]
"src/jolty/cli.py" = ["T201"]  # a command line prints
"src/jolty/units.py" = ["N816"]  # unit names keep their SI case: kHz, mV, uF

[tool.ruff.format]
docstring-code-format = true

# ty: every rule is an error, including those it leaves off or only warns on.
[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["src", "tests", "examples", "docs"]

[tool.pytest]
testpaths = ["src", "tests"]
addopts = [
    "--import-mode=importlib",
    "--doctest-modules",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
filterwarnings = ["error"]
xfail_strict = true
# Expected output in docstrings wraps at 88 columns like the code around it.
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

# rumdl: its tables live in .rumdl.toml, because rumdl reads code-block-tools
# only from its own file (rvben/rumdl#851) and uses the first config file it
# finds, so a tool.rumdl table here would be dead while that file exists. When
# the fix lands, move every table from .rumdl.toml under tool.rumdl, delete it.
