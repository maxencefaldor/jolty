[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "jolty"
version = "0.1.0"
description = "A compiler and simulator for electronic circuits, built for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.15"
authors = [{ name = "Maxence Faldor", email = "maxencefaldor@gmail.com" }]
dependencies = [
    "numpy>=2.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.optional-dependencies]
jax = ["jax>=0.12"]
mcp = ["matplotlib>=3.10", "mcp>=2.1"]
plots = ["matplotlib>=3.10"]

[project.scripts]
jolty = "jolty.cli:main"
jolty-mcp = "jolty.mcp:main"

[project.urls]
Source = "https://github.com/maxencefaldor/jolty"
Issues = "https://github.com/maxencefaldor/jolty/issues"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "hypothesis",
    "jax>=0.12",
    "matplotlib>=3.10",
    "maturin",
    "mcp>=2.1",
    "mpmath>=1.4.1",
    "pytest",
    "pytest-xdist",
    "ruff",
    "rumdl",
    "ty",
]
docs = [
    "matplotlib>=3.10",
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.1.1",
]

[tool.uv]
# uv rebuilds the extension whenever any listed file changes, including Rust sources.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.md" },
    { file = "docs/guide/**/*.md" },
    { file = "examples/**/*.py" },
]

[tool.maturin]
manifest-path = "crates/jolty-python/Cargo.toml"
module-name = "jolty._core"
python-source = "src"
features = ["pyo3/extension-module"]
include = [
    { path = "docs/guide/**/*.md", format = "sdist" },
    { path = "examples/**/*.py", format = "sdist" },
    { path = "docs.json", from = "out-dir", to = "jolty/assets" },
]

# ruff uses default formatting (4 spaces, 88 columns) and enables every stable lint rule.
[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# COM812 conflicts with the ruff formatter, which manages trailing commas automatically.
# TC: pydantic evaluates type annotations at runtime, so annotated types stay runtime imports.
ignore = ["COM812", "TC"]

[tool.ruff.lint.flake8-builtins]
# "id" names an instance across the circuit format, engine, and builder.
builtins-ignorelist = ["id"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest uses assert statements and path-based imports; test names describe intent, and
# literal expectations are test data.
"tests/**" = ["D100", "D103", "INP001", "PLR2004", "S101"]
# Example scripts run outside any package and embed circuit literal values directly.
"examples/**" = ["INP001", "PLR2004"]
# Documentation generator scripts run outside any package and print progress.
"docs/*.py" = ["INP001", "T201"]
# Discovery scripts run outside any package, embed circuit literals, and print findings.
"docs/discovery/**" = ["INP001", "PLR2004", "T201"]
# Agent benchmark scripts run outside any package and print evaluation results.
"benchmarks/agents/**/*.py" = ["INP001", "T201"]
# Benchmark suites and fixtures run as standalone scripts, embed circuit literals, and
# print measurements.
"benchmarks/deterministic/**/*.py" = ["INP001", "PLR2004", "T201"]
"benchmarks/measuring.py" = ["INP001", "T201"]
"benchmarks/simulators.py" = ["INP001"]
"benchmarks/speed/**/*.py" = ["INP001", "PLR2004", "T201"]
"benchmarks/precision/**/*.py" = ["INP001", "PLR2004", "T201"]
"benchmarks/robustness/**/*.py" = ["INP001", "PLR2004", "T201"]
"benchmarks/coverage/**/*.py" = ["INP001", "PLR2004", "T201"]
"src/jolty/cli.py" = ["T201"]  # CLI prints directly to stdout
"src/jolty/units.py" = ["N816"]  # unit names preserve SI case: kHz, mV, uF

[tool.ruff.format]
docstring-code-format = true

# ty treats every rule as an error, including rules disabled or warned on by default.
[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["src", "tests", "examples", "docs", "benchmarks"]

[tool.ty.environment]
# Additional import roots matching standalone execution paths for tests, benchmarks,
# examples, and discoveries. Tests import shared harnesses (`tests/differential.py`),
# and agent benchmark scripts import sibling modules directly. Discovery scripts
# import `examples/common.py`, and `bjt_amp.py` imports `examples/cluster/amplifier.py`.
# Benchmark suites import helpers from `benchmarks/` and sibling modules such as
# `benchmarks/speed/timing.py`, `benchmarks/speed/circuits/fixture.py`,
# `benchmarks/robustness/corpus.py`, precision modules, and `benchmarks/coverage/matrix.py`.
extra-paths = [
    "tests",
    "benchmarks/agents",
    "examples",
    "examples/cluster",
    "benchmarks",
    "benchmarks/speed",
    "benchmarks/speed/circuits",
    "benchmarks/robustness",
    "benchmarks/precision",
    "benchmarks/coverage",
]

# coverage.py configuration used by scripts/coverage for Python line and branch coverage.
# Subprocess patching captures pytest-xdist workers and jolty.runner child processes,
# writing a separate data file per process before combining results.
[tool.coverage.run]
source_pkgs = ["jolty"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.pytest]
testpaths = ["src", "tests"]
# Import paths for shared test harnesses (`differential`, `strategies`) and benchmark
# modules across `benchmarks/` and each benchmark suite directory.
pythonpath = [
    "tests",
    "benchmarks",
    "benchmarks/agents",
    "benchmarks/speed",
    "benchmarks/robustness",
    "benchmarks/precision",
    "benchmarks/coverage",
]
# Run tests across one pytest-xdist worker per CPU core. Random-circuit tests run for
# minutes, so worksteal scheduling lets idle workers pull queued tests.
addopts = [
    "--import-mode=importlib",
    "--doctest-modules",
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--numprocesses=auto",
    "--dist=worksteal",
]
filterwarnings = ["error"]
xfail_strict = true
# Expected output in docstrings wraps at 88 columns like surrounding code.
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

# Markdown linting and formatting via rumdl, complementing ruff for Python code.
# Documentation builds with Zensical using MkDocs Markdown (admonitions, tabs, and
# <div> grid cards).
[tool.rumdl]
flavor = "mkdocs"

# Prose uses one sentence per line so the renderer handles wrapping with no width limit.
# The formatter joins wrapped sentences and splits lines containing multiple sentences.
[tool.rumdl.MD013]
line-length = 0
reflow = true
reflow-mode = "sentence-per-line"
# Sentences may open with lowercase tool names such as ruff, uv, or jax.
require-sentence-capital = false

[tool.rumdl.MD004]
style = "dash"

[tool.rumdl.MD025]
front-matter-title = ""

# Require fenced code blocks rather than indented blocks so language tags drive
# code-block tools below.
[tool.rumdl.MD046]
style = "fenced"

[tool.rumdl.MD029]
style = "one"

# Python blocks in Markdown follow standard ruff rules except whole-module checks.
# Excerpts omit module imports, docstrings, and copyright headers present in full scripts.
[tool.rumdl.code-block-tools]
enabled = true

[tool.rumdl.code-block-tools.tools.ruff-excerpt]
command = ["ruff", "check", "--output-format=concise", "--ignore", "CPY001,D,F821", "-"]

[tool.rumdl.code-block-tools.languages.python]
lint = ["ruff-excerpt"]
format = ["ruff:format"]

[tool.rumdl.MD033]
allowed-elements = ["div"]
