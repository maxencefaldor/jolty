[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "jolty"
version = "0.1.0"
description = "A compiler and simulator for electronic circuits, built for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.15"
authors = [{ name = "Maxence Faldor", email = "maxencefaldor@gmail.com" }]
dependencies = [
    "numpy>=2.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.optional-dependencies]
jax = ["jax>=0.12"]
mcp = ["matplotlib>=3.10", "mcp>=2.1"]
plots = ["matplotlib>=3.10"]

[project.scripts]
jolty = "jolty.cli:main"
jolty-mcp = "jolty.mcp:main"

[project.urls]
Source = "https://github.com/maxencefaldor/jolty"
Issues = "https://github.com/maxencefaldor/jolty/issues"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "hypothesis",
    "jax>=0.12",
    "matplotlib>=3.10",
    "maturin",
    "mcp>=2.1",
    "mpmath>=1.4.1",
    "pytest",
    "pytest-xdist",
    "ruff",
    "rumdl",
    "ty",
]
docs = [
    "matplotlib>=3.10",
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.1.1",
]

[tool.uv]
# uv rebuilds the extension when one of these changes, its Rust sources included.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.md" },
    { file = "docs/guide/**/*.md" },
    { file = "examples/**/*.py" },
]

[tool.maturin]
manifest-path = "crates/jolty-python/Cargo.toml"
module-name = "jolty._core"
python-source = "src"
features = ["pyo3/extension-module"]
include = [
    { path = "docs/guide/**/*.md", format = "sdist" },
    { path = "examples/**/*.py", format = "sdist" },
    { path = "docs.json", from = "out-dir", to = "jolty/assets" },
]

# ruff: the formatter at its defaults (4 spaces, 88 columns), so no width and
# no indent appear here. The lint is strict: every stable rule is on.
[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# The one rule the formatter contradicts: it places trailing commas itself.
# TC: pydantic reads annotations at runtime, so an import used only in an
# annotation is still a runtime import.
ignore = ["COM812", "TC"]

[tool.ruff.lint.flake8-builtins]
# "id" names an instance in the circuit format, the engine and the builder alike.
builtins-ignorelist = ["id"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest checks with assert and imports tests by path; a test's name says what it
# checks, and the values it expects are its content.
"tests/**" = ["D100", "D103", "INP001", "PLR2004", "S101"]
# Examples are circuits written as scripts: their numbers are the circuit, and
# they run as scripts, outside any package.
"examples/**" = ["INP001", "PLR2004"]
# Scripts that write the docs' pages run outside any package, and say what they wrote.
"docs/*.py" = ["INP001", "T201"]
# Discoveries run as scripts, outside any package: their numbers are the circuit, and
# their explorations print what they found.
"docs/discovery/**" = ["INP001", "PLR2004", "T201"]
# The agents' benchmark runs as scripts, outside any package, and prints what it found.
"benchmarks/agents/**/*.py" = ["INP001", "T201"]
# The other suites, their fixtures' scripts and their runners run as scripts, outside
# any package: the fixtures' numbers are their circuits, and the suites print what they
# measured.
"benchmarks/deterministic.py" = ["INP001", "PLR2004", "T201"]
"benchmarks/measuring.py" = ["INP001", "T201"]
"benchmarks/simulators.py" = ["INP001"]
"benchmarks/speed/**/*.py" = ["INP001", "PLR2004", "T201"]
"benchmarks/precision/**/*.py" = ["INP001", "PLR2004", "T201"]
"benchmarks/robustness/**/*.py" = ["INP001", "PLR2004", "T201"]
"benchmarks/coverage/**/*.py" = ["INP001", "PLR2004", "T201"]
"src/jolty/cli.py" = ["T201"]  # a command line prints
"src/jolty/units.py" = ["N816"]  # unit names keep their SI case: kHz, mV, uF

[tool.ruff.format]
docstring-code-format = true

# ty: every rule is an error, including those it leaves off or only warns on.
[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["src", "tests", "examples", "docs", "benchmarks"]

[tool.ty.environment]
# The tests import their shared harness, `tests/differential.py`, as pytest does, the
# agents' benchmark's scripts, which import each other, as their runs do, the
# discoveries the parts the examples share, `examples/common.py`, as their scripts do,
# the speed suite's `bjt_amp.py` the amplifier of `examples/cluster/amplifier.py`,
# and every other suite the measuring helpers and runners of `benchmarks/`, and its own
# modules beside it: the speed suite its timing, `benchmarks/speed/timing.py`, which its
# tests import too, and its fixtures' scripts what they share,
# `benchmarks/speed/circuits/fixture.py`, the corpus of hard circuits
# `benchmarks/robustness/corpus.py` and those beside it, the precision suite its
# modules, and the coverage matrix `benchmarks/coverage/matrix.py` and those beside it.
extra-paths = [
    "tests",
    "benchmarks/agents",
    "examples",
    "examples/cluster",
    "benchmarks",
    "benchmarks/speed",
    "benchmarks/speed/circuits",
    "benchmarks/robustness",
    "benchmarks/precision",
    "benchmarks/coverage",
]

# coverage.py, which scripts/coverage runs the Python tests under: the package's lines
# and branches, in every process the tests start, pytest-xdist's workers and the scripts
# jolty.runner runs among them, each writing a data file of its own until combined.
[tool.coverage.run]
source_pkgs = ["jolty"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.pytest]
testpaths = ["src", "tests"]
# The tests share harness modules, `differential` and `strategies`, which they import
# from there, and import the suites' measuring helpers and runners from `benchmarks`,
# the agents' benchmark's modules, the speed suite's timing, the corpus of hard
# circuits' modules, the precision suite's modules and the coverage matrix's from
# beside them.
pythonpath = [
    "tests",
    "benchmarks",
    "benchmarks/agents",
    "benchmarks/speed",
    "benchmarks/robustness",
    "benchmarks/precision",
    "benchmarks/coverage",
]
# The tests run in a process per processor, pytest-xdist's. Each test of random circuits
# is one item that runs for minutes, so a process that finishes its share takes tests
# still waiting behind another's, rather than wait idle: worksteal.
addopts = [
    "--import-mode=importlib",
    "--doctest-modules",
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--numprocesses=auto",
    "--dist=worksteal",
]
filterwarnings = ["error"]
xfail_strict = true
# Expected output in docstrings wraps at 88 columns like the code around it.
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

# Markdown lints and formats with rumdl, beside ruff for the code. jolty's docs are a
# Zensical site, which reads MkDocs Markdown: admonitions, content tabs and grid cards,
# built from <div> blocks.
[tool.rumdl]
flavor = "mkdocs"

# Prose is one sentence per line and the renderer wraps: no width limit, and
# the formatter joins a wrapped sentence and splits a line holding two.
[tool.rumdl.MD013]
line-length = 0
reflow = true
reflow-mode = "sentence-per-line"
# A sentence may open with a lowercase name: ruff, uv, jax.
require-sentence-capital = false

[tool.rumdl.MD004]
style = "dash"

[tool.rumdl.MD025]
front-matter-title = ""

# Fenced blocks, never indented: only a fence can name its language, and the
# code-block tools below key on that name.
[tool.rumdl.MD046]
style = "fenced"

[tool.rumdl.MD029]
style = "one"

# Python examples in the markdown are held to the same ruff rules as the code,
# except the rules a whole module answers to: an example is an excerpt, so its
# names are defined, and its docstrings and copyright line written, in the
# module it is lifted from.
[tool.rumdl.code-block-tools]
enabled = true

[tool.rumdl.code-block-tools.tools.ruff-excerpt]
command = ["ruff", "check", "--output-format=concise", "--ignore", "CPY001,D,F821", "-"]

[tool.rumdl.code-block-tools.languages.python]
lint = ["ruff-excerpt"]
format = ["ruff:format"]

[tool.rumdl.MD033]
allowed-elements = ["div"]
