[project]
site_name = "jolty"
site_description = "A compiler and simulator for electronic circuits, built for AI agents."
site_author = "Maxence Faldor"
site_url = "https://maxencefaldor.github.io/jolty/"
repo_url = "https://github.com/maxencefaldor/jolty"
repo_name = "maxencefaldor/jolty"
exclude_docs = """
*.py
__pycache__/
"""
copyright = "Copyright 2026 Maxence Faldor. Licensed under the Apache License 2.0."
extra_css = ["assets/jolty.css"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "Guide" = [
    "guide/index.md",
    { "Components" = "guide/components.md" },
    { "Units" = "guide/units.md" },
    { "Devices" = "guide/devices.md" },
    { "Logic" = "guide/logic.md" },
    { "SPICE models" = "guide/spice.md" },
    { "Foundry processes" = "guide/foundry.md" },
    { "Checks" = "guide/checks.md" },
    { "Schematics" = "guide/schematics.md" },
    { "3D viewer" = "guide/viewer.md" },
    { "Simulation" = "guide/simulation.md" },
    { "Results" = "guide/results.md" },
    { "Specs" = "guide/specs.md" },
    { "Fidelity" = "guide/fidelity.md" },
    { "Parts and costs" = "guide/parts.md" },
  ] },
  { "Gallery" = "gallery.md" },
  { "Discovery" = "discovery.md" },
  { "Agents" = [
    "agents/index.md",
    { "Connect an agent" = "agents/connect.md" },
    { "Why a compiler" = "agents/why-a-compiler.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Command line" = "reference/cli.md" },
    { "Rules" = "reference/rules.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Expressions" = "reference/expressions.md" },
    { "Python API" = [
      { "Circuits" = "reference/circuits.md" },
      { "Simulation" = "reference/simulation.md" },
      { "Images" = "reference/images.md" },
    ] },
  ] },
  { "Contributing" = "contributing.md" },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Listing extensions replaces Zensical's defaults, which leave out snippets: the docs use only these.
[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [{ name = "mermaid", class = "mermaid" }]
pymdownx.tabbed.alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://docs.pydantic.dev/latest/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true
show_bases = false
filters = ["!^_"]
