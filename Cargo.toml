[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/maxencefaldor/jolty"
authors = ["Maxence Faldor"]

[workspace.dependencies]
jolty-engine = { path = "crates/jolty-engine" }
jolty-ir = { path = "crates/jolty-ir" }
jolty-models = { path = "crates/jolty-models" }
jolty-numerics = { path = "crates/jolty-numerics" }

dyn-stack = "0.13"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
num-complex = "0.4"
numpy = "0.30"
proptest = "1.12"
pyo3 = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
