[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/maxencefaldor/jolty"
authors = ["Maxence Faldor"]
keywords = ["circuit", "simulation", "spice", "electronics", "agents"]
categories = ["science", "simulation", "compilers"]

[workspace.dependencies]
jolty-checks = { path = "crates/jolty-checks", version = "0.1.0" }
jolty-derive = { path = "crates/jolty-derive", version = "0.1.0" }
jolty-engine = { path = "crates/jolty-engine", version = "0.1.0" }
jolty-expressions = { path = "crates/jolty-expressions", version = "0.1.0" }
jolty-ir = { path = "crates/jolty-ir", version = "0.1.0" }
jolty-models = { path = "crates/jolty-models", version = "0.1.0" }
jolty-numerics = { path = "crates/jolty-numerics", version = "0.1.0" }

allocation-counter = "0.8.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dyn-stack = "0.13"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
gungraun = "0.20.0"
mimalloc = { version = "0.1.52", default-features = false }
num-complex = "0.4"
numpy = "0.30"
proc-macro2 = "1.0.107"
proptest = { version = "1.12", default-features = false, features = ["std"] }
pyo3 = "0.30"
quote = "1.0.47"
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
rand_distr = { version = "0.6", default-features = false, features = ["std_math"] }
rayon = "1.12"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
syn = "3.0.10"
thiserror = "2.0.21"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

# Optimize jolty-numerics in dev and test builds while keeping debug assertions and
# overflow checks enabled. On a 64-core AMD EPYC 9B14, sparse LU proptests drop 11.1x
# under load (225.2 s -> 20.3 s; 163.7 s -> 10.1 s isolated, 16.2x). Full workspace
# nextest drops from 302.4 s to 107.2 s (2.82x; sharding alone 228.5 s) without
# rebuilding on jolty-models edits. Tradeoff: inlining inside jolty-numerics reduces
# debugger variable visibility and slightly shifts LLVM coverage branch counts.
[profile.dev.package.jolty-numerics]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
