[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/maxencefaldor/jolty"
authors = ["Maxence Faldor"]
keywords = ["circuit", "simulation", "spice", "electronics", "agents"]
categories = ["science", "simulation", "compilers"]

[workspace.dependencies]
jolty-checks = { path = "crates/jolty-checks", version = "0.1.0" }
jolty-engine = { path = "crates/jolty-engine", version = "0.1.0" }
jolty-expressions = { path = "crates/jolty-expressions", version = "0.1.0" }
jolty-ir = { path = "crates/jolty-ir", version = "0.1.0" }
jolty-models = { path = "crates/jolty-models", version = "0.1.0" }
jolty-numerics = { path = "crates/jolty-numerics", version = "0.1.0" }

criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dyn-stack = "0.13"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
num-complex = "0.4"
numpy = "0.30"
proptest = "1.12"
pyo3 = "0.30"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
