[package]
name = "jolty-models"
description = "Device models for jolty: what each kind of device contributes to a circuit's equations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
jolty-derive.workspace = true
jolty-expressions.workspace = true
jolty-ir.workspace = true
jolty-numerics.workspace = true
rayon.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# The bench that evaluates one device alone, for the tests of crates whose kernels
# implement this crate's.
testing = []

[dev-dependencies]
allocation-counter.workspace = true
criterion.workspace = true
gungraun.workspace = true
# The crate itself with its bench, for its benchmarks.
# Path-only so `cargo package` / `cargo publish` strips this self-dependency rather than
# requiring an already-published version on crates.io.
jolty-models = { path = ".", features = ["testing"] }
proptest.workspace = true

[[bench]]
name = "evaluation"
harness = false
required-features = ["testing"]

[[bench]]
name = "instructions"
harness = false
required-features = ["testing"]

[lints]
workspace = true
