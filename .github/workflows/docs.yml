name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv tags each release but, since v8, no major version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Check the reference pages and build the site
        run: scripts/check docs
      - name: Keep the site for Pages
        if: github.event_name != 'pull_request' && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    name: Publish to GitHub Pages
    # A repository publishes once GitHub Pages is enabled for it, with GitHub Actions as
    # its source; until then the site is built and checked, and not published.
    if: github.event_name != 'pull_request' && github.event.repository.has_pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
