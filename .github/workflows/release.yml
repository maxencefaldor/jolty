name: Release

# A tag such as v0.1.0 releases that version: it builds the wheels and the source
# distribution, publishes them to PyPI through trusted publishing, and publishes the Rust
# crates to crates.io with the CARGO_REGISTRY_TOKEN secret. Nothing publishes without a
# tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag matches the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with pyproject.toml and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          rust="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$tag" = "$python" && test "$tag" = "$rust"

  wheels:
    name: Wheel for Python ${{ matrix.python }} on ${{ matrix.os }} ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Strip release wheel symbols on Linux and Windows. Keep macOS unstripped
          # because Apple Command Line Tools 27.2 strip corrupts the Mach-O LINKEDIT
          # string pool alignment, causing macOS 27.2 dyld to reject the extension
          # ("mis-aligned LINKEDIT string pool").
          - { os: ubuntu-24.04, target: x86_64, manylinux: "2_28", python: "3.15", strip: symbols }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28", python: "3.15", strip: symbols }
          - { os: macos-15, target: aarch64, manylinux: "off", python: "3.15", strip: none }
          - { os: macos-15-intel, target: x86_64, manylinux: "off", python: "3.15", strip: none }
          - { os: windows-2025, target: x64, manylinux: "off", python: "3.15", strip: symbols }
          - { os: ubuntu-24.04, target: x86_64, manylinux: "2_28", python: "3.15t", strip: symbols }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28", python: "3.15t", strip: symbols }
          - { os: macos-15, target: aarch64, manylinux: "off", python: "3.15t", strip: none }
          - { os: macos-15-intel, target: x86_64, manylinux: "off", python: "3.15t", strip: none }
          - { os: windows-2025, target: x64, manylinux: "off", python: "3.15t", strip: symbols }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Forward CARGO_PROFILE_RELEASE_STRIP into manylinux containers as well as native
      # host builds so Linux and Windows strip symbols while macOS stays at "none".
      - uses: PyO3/maturin-action@v1
        env:
          CARGO_PROFILE_RELEASE_STRIP: ${{ matrix.strip }}
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: ${{ matrix.manylinux != 'off' && '-e CARGO_PROFILE_RELEASE_STRIP' || '' }}
          args: --release --out dist --interpreter python${{ matrix.python }}
      # The wheel alone in a fresh environment, its dependencies from PyPI, simulates an
      # example and meets its specs; a free-threaded one loads without the GIL.
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m venv smoke
          if [ "$RUNNER_OS" = Windows ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          "$bin/python" -m pip install --quiet dist/*.whl
          if [ "${{ matrix.python }}" = 3.15t ]; then
            "$bin/python" -c "import sys, jolty._core; assert not sys._is_gil_enabled()"
          fi
          "$bin/jolty" simulate examples/rc_filter.py > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python }}-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/jolty
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/jolty-engine
    steps:
      - uses: actions/checkout@v7
      # setup-uv tags each release but, since v8, no major version.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python, which PyO3 builds against
        run: uv python install
      - name: Publish every crate but the extension, in dependency order
        run: cargo publish --workspace --exclude jolty-python
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
