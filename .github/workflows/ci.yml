name: CI

on:
  # Every branch pushed, so that a branch is checked as main will be before it lands.
  push:
    branches: ["**"]
  pull_request:
  # Weekly on main as well, so that an advisory published against a locked dependency
  # fails a run though nothing was pushed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always
  RUFF_OUTPUT_FORMAT: github

jobs:
  rust:
    name: Rust format, lints and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # setup-uv tags each release but, since v8, no major version.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python, which PyO3 builds against
        run: uv python install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit, which checks the crates against RustSec's advisories
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Install cargo-nextest, which runs the Rust tests
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Check
        run: scripts/check rust

  python:
    name: Python format, lints, types, Markdown and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # Long enough for macOS's three cores, where building the extension and running the
    # tests took 21 minutes on 16 November, and short enough to stop a hung run.
    timeout-minutes: 40
    env:
      # The differential tests fail, rather than skip, if ngspice is missing.
      JOLTY_REQUIRE_NGSPICE: "1"
      # Parallel codegen without LTO keeps opt-level=3 test speed while cutting CI
      # compile time; release.yml still builds published wheels with LTO and cgu=1.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@v2
      # ngspice's latest release from Homebrew on both systems: Ubuntu's is 42, whose
      # MOSFETs' flicker noise, before ngspice 43, is no longer what jolty computes.
      - name: Install ngspice, the reference simulator of the differential tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            dirname "$(command -v brew)" >> "$GITHUB_PATH"
          fi
          brew install ngspice
          ngspice --version | head -2
      - name: Check
        run: scripts/check python

  free-threaded:
    name: Python tests on free-threaded Python, without the GIL
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Install ngspice, the reference simulator of the differential tests
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          dirname "$(command -v brew)" >> "$GITHUB_PATH"
          brew install ngspice
      - name: Check
        run: scripts/check free-threaded

  coverage:
    name: Coverage of the Rust and Python tests, reported, never checked
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JOLTY_REQUIRE_NGSPICE: "1"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python, which PyO3 builds against
        run: uv python install
      - uses: Swatinem/rust-cache@v2
      - name: Install llvm-tools, with which cargo-llvm-cov reads the profiles
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - name: Install cargo-llvm-cov, which measures Rust's coverage
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Install ngspice, the reference simulator of the differential tests
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          dirname "$(command -v brew)" >> "$GITHUB_PATH"
          brew install ngspice
      - name: Measure
        run: scripts/coverage
      - name: Keep the reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            target/coverage/*.lcov
            target/coverage/rust
            target/coverage/python

  mutants:
    name: Mutants of the change, reported, never checked
    # Run on main, weekly schedule, or manual dispatch so branch pushes finish quickly.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python, which PyO3 builds against
        run: uv python install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants, which mutates the code the change touches
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutate
        env:
          # A pull request's change is from its base, a branch's from main, and main's
          # from the commit before the push.
          BASE: >-
            ${{ github.event.pull_request.base.sha
            || (github.ref != 'refs/heads/main' && 'origin/main')
            || github.event.before
            || 'HEAD~1' }}
        # A change of many mutants outlasts the job, which would end the run cancelled:
        # stopped 15 minutes short of the job's limit, cargo-mutants keeps the outcomes it
        # has, and the report says which mutants it reached.
        run: timeout --signal=INT 45m scripts/mutants "$BASE" || [ "$?" -eq 124 ]
      - name: Keep the outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants
          path: mutants.out
