name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always
  RUFF_OUTPUT_FORMAT: github

jobs:
  rust:
    name: Rust format, lints and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # setup-uv tags each release but, since v8, no major version.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python, which PyO3 builds against
        run: uv python install
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: scripts/check rust

  python:
    name: Python format, lints, types, Markdown and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Install ngspice, the reference simulator of the differential tests
        run: sudo apt-get update && sudo apt-get install --yes ngspice
      - name: Check
        run: scripts/check python
