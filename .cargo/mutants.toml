# cargo-mutants, which scripts/mutants runs: each mutant is tested by its crate's own
# tests, built and run with the versions Cargo.lock holds.
additional_cargo_args = ["--locked"]
# The extension's code is tested by the Python tests, which cargo-mutants cannot run, so
# every mutant of it would be missed.
exclude_globs = ["crates/jolty-python/**"]
