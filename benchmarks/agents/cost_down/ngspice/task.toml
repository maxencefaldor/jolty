jolty = '''Your design is scored by building it, simulating it with the plan and specs of the original `bias.py`, and pricing `X1` with `catalog.json`'''
ngspice = '''Your design is scored by reading it, simulating it as `X1` on the original bench with the original's specs and yield, and pricing `X1` with `catalog.json`'''
