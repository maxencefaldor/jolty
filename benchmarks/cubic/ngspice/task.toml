[[replace]]
jolty = '''Every transistor of an integrated circuit matches every other, so a diode is an `npn()` whose base joins its collector.'''
ngspice = '''Every transistor of an integrated circuit matches every other, so a diode is an `npn` transistor whose base joins its collector.'''
