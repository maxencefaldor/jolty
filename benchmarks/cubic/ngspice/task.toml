# The ngspice arm's prompt: task.md, with each of these sentences in place of the
# jolty arm's, and the tools of ../../ngspice.toml in place of jolty's.

[[replace]]
jolty = '''Write `design.py`, a script whose `build()` returns your circuit as a component with five ports: `supply`, `reference`, `input`, `output` and `ground`.'''
ngspice = '''Write `design.cir`, a SPICE library whose subcircuit `design` is your circuit, its pins `supply`, `reference`, `input` and `output`, and its ground SPICE's node `0`.'''

